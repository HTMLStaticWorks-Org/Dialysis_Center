<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Patient Account | Dialysis Center</title>
  <meta name="description" content="Register for the Dialysis Center Patient Portal to schedule dialysis sessions, view treatment records, and manage insurance details.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>

<body>
  <div class="position-fixed top-0 end-0 p-3 z-3 d-flex align-items-center gap-2">
    <button type="button" class="icon-btn theme-toggle" aria-label="Toggle color theme">
      <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn rtl-toggle" aria-label="Toggle RTL layout" title="Toggle RTL">
      <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
    </button>
  </div>

  <main class="auth-wrapper" style="min-height: 100vh;">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="navbar-brand-wrap justify-content-center mb-3" aria-label="Dialysis Center Home">
          <span class="brand-mark"><i class="bi bi-droplet-half"></i></span>
          <span class="text-start">
            <span class="brand-title d-block">Dialysis Center</span>
            <span class="brand-subtitle">Renal Healthcare</span>
          </span>
        </a>
        <span class="section-eyebrow"><i class="bi bi-person-plus"></i> Patient Enrollment</span>
        <h1 class="h3 mb-1">Create Patient Account</h1>
        <p class="small mb-0">Register to book sessions and view your renal care records.</p>
      </div>

      <form data-validate="true" data-redirect="patient-dashboard.html" data-success-msg="Account created! Opening your Patient Dashboard..." novalidate>
        <div class="alert d-none form-feedback" role="alert"></div>

        <div class="mb-3">
          <label for="regName" class="form-label">Patient Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="Robert Jenkins" required>
        </div>

        <div class="mb-3">
          <label for="regEmail" class="form-label">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="patient@example.com" required>
        </div>

        <div class="mb-3">
          <label for="regModality" class="form-label">Primary Treatment Program</label>
          <select id="regModality" class="form-select" required>
            <option value="">Select modality...</option>
            <option>In-Center Hemodialysis</option>
            <option>Nocturnal Hemodialysis</option>
            <option>Peritoneal Dialysis (Home)</option>
            <option>Pre-Dialysis Renal Care</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="regPassword" class="form-label">Create Password</label>
          <div class="password-field">
            <input type="password" id="regPassword" class="form-control" minlength="6" placeholder="Minimum 6 characters" required>
            <button type="button" class="password-toggle" data-target="regPassword" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-medical btn-medical-primary w-100 mb-3">
          <i class="bi bi-check2-circle"></i> Register &amp; Open Portal
        </button>
      </form>

      <p class="text-center small mb-0">
        Already registered? <a href="login.html" class="fw-semibold">Sign In Here</a>
      </p>

      <div class="pt-3 mt-4 border-top text-center">
        <span class="d-block small text-muted mb-2">Connect with Dialysis Center</span>
        <div class="d-flex justify-content-center gap-2">
          <a href="#social-facebook" class="icon-btn" aria-label="Dialysis Center on Facebook" title="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#social-instagram" class="icon-btn" aria-label="Dialysis Center on Instagram" title="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#social-linkedin" class="icon-btn" aria-label="Dialysis Center on LinkedIn" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
          <a href="#social-twitter" class="icon-btn" aria-label="Dialysis Center on X" title="X (Twitter)"><i class="bi bi-twitter-x"></i></a>
          <a href="#social-youtube" class="icon-btn" aria-label="Dialysis Center on YouTube" title="YouTube"><i class="bi bi-youtube"></i></a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
