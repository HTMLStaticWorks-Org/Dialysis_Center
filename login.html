<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login | Dialysis Center</title>
  <meta name="description" content="Sign in to your Dialysis Center Patient Portal to manage dialysis appointments, view lab records, and access billing.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>

<body>
  <div class="position-fixed top-0 end-0 p-3 z-3 d-flex align-items-center gap-2">
    <button type="button" class="icon-btn theme-toggle" aria-label="Toggle color theme">
      <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn rtl-toggle" aria-label="Toggle RTL layout" title="Toggle RTL">
      <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
    </button>
  </div>

  <main class="auth-wrapper" style="min-height: 100vh;">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="navbar-brand-wrap justify-content-center mb-3" aria-label="Dialysis Center Home">
          <span class="brand-mark"><i class="bi bi-droplet-half"></i></span>
          <span class="text-start">
            <span class="brand-title d-block">Dialysis Center</span>
            <span class="brand-subtitle">Renal Healthcare</span>
          </span>
        </a>
        <span class="section-eyebrow"><i class="bi bi-shield-lock"></i> HIPAA Secure Portal</span>
        <h1 class="h3 mb-1">Patient Sign In</h1>
        <p class="small mb-0">Access your dialysis schedule, lab adequacy results, and billing.</p>
      </div>

      <form data-validate="true" data-redirect="patient-dashboard.html" data-success-msg="Signed in! Redirecting to your Patient Dashboard..." novalidate>
        <div class="alert d-none form-feedback" role="alert"></div>

        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email or Patient ID</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="patient@example.com" required>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="loginPassword" class="form-label">Password</label>
            <a href="contact.html" class="small">Forgot password?</a>
          </div>
          <div class="password-field">
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small" for="rememberMe">Keep me signed in on this device</label>
        </div>

        <button type="submit" class="btn-medical btn-medical-primary w-100 mb-3">
          <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
        </button>
      </form>

      <p class="text-center small mb-0">
        New patient at Dialysis Center? <a href="register.html" class="fw-semibold">Create Patient Account</a>
      </p>

      <div class="pt-3 mt-4 border-top text-center">
        <span class="d-block small text-muted mb-2">Connect with Dialysis Center</span>
        <div class="d-flex justify-content-center gap-2">
          <a href="#social-facebook" class="icon-btn" aria-label="Dialysis Center on Facebook" title="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#social-instagram" class="icon-btn" aria-label="Dialysis Center on Instagram" title="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#social-linkedin" class="icon-btn" aria-label="Dialysis Center on LinkedIn" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
          <a href="#social-twitter" class="icon-btn" aria-label="Dialysis Center on X" title="X (Twitter)"><i class="bi bi-twitter-x"></i></a>
          <a href="#social-youtube" class="icon-btn" aria-label="Dialysis Center on YouTube" title="YouTube"><i class="bi bi-youtube"></i></a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
